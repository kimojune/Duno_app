<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duno</title>
<style>
/* :root의 값은 lib/design-tokens.ts와 같아야 한다(정적 파일이라 그 모듈을 못 읽는다. tests/unit/design-tokens.test.ts가 같은지 본다).
   값을 바꿀 때는 그 표와 app/globals.css :root도 같이 바꾼다. :root 밖에서는 색 hex를 쓰지 않는다. */
:root{
  --color-bg:#FAF7F2;--color-text:#1C2340;--color-text-sub:#5E6478;
  --color-accent:#FF8A57;--color-primary:#1C2340;--color-primary-pressed:#2E3350;--color-on-primary:#FFFFFF;--color-notice-bg:#F3EEE6;
  --font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  --font-title:700 24px/32px var(--font-family);
  --font-body:400 16px/24px var(--font-family);
  --tap-min:48px;--page-x:16px;--page-max:480px;--radius-pill:999px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:var(--font-body)}
/* 고침10 QA1 ②(Fig 149:105): 고리 y 18 · 카드 위 72 */
main{max-width:var(--page-max);margin:0 auto;padding:16px var(--page-x) 24px}
h1{margin:0;display:flex;align-items:center;gap:6px;font:700 16px/24px var(--font-family)}
.ring{display:block;flex:none;width:18px;height:18px;overflow:visible;fill:var(--color-text)}
.piece{fill:var(--color-accent)}
.notice{margin-top:32px;padding:12px 16px;border-radius:8px;background:var(--color-notice-bg);overflow-wrap:anywhere}
.notice p{margin:0}
/* 주 단추: 카드 안 폭 가득 · 16 Bold(1절 C) */
.btn{display:flex;align-items:center;justify-content:center;inline-size:100%;min-height:var(--tap-min);margin-top:16px;padding:0 16px;border:1px solid var(--color-primary);border-radius:var(--radius-pill);background:var(--color-primary);color:var(--color-on-primary);font:700 16px/24px var(--font-family);cursor:pointer}
.btn:active{background:var(--color-primary-pressed);border-color:var(--color-primary-pressed)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>
<main>
<!-- 로그인 여부를 알 수 없으니 로그인·할 일 화면을 흉내 내지 않는다. 맨 위 = 워드마크(고리 + duno, components/wordmark.tsx와 같은 모양, Figma 149:105). 바깥 파일·글꼴 없이 인라인 SVG -->
<h1 aria-label="두노"><svg class="ring" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M17.6933 6.67063C18.2061 8.58433 18.0731 10.6138 17.3149 12.4442C16.5568 14.2746 15.2158 15.8036 13.5 16.7942C11.7842 17.7848 9.78954 18.1816 7.82528 17.923C5.86102 17.6644 4.03698 16.7649 2.63605 15.364C1.23513 13.963 0.335609 12.139 0.077009 10.1747C-0.181591 8.21048 0.21518 6.21578 1.20578 4.5C2.19639 2.78423 3.72546 1.44326 5.55586 0.685088C7.38626 -0.073088 9.41568 -0.206104 11.3294 0.306671L10.2941 4.17037C9.23094 3.8855 8.10348 3.9594 7.0866 4.38061C6.06971 4.80181 5.22022 5.54679 4.66989 6.5C4.11955 7.45321 3.89912 8.56138 4.04279 9.65263C4.18646 10.7439 4.68619 11.7572 5.46448 12.5355C6.24277 13.3138 7.25613 13.8136 8.34738 13.9572C9.43864 14.1009 10.5468 13.8805 11.5 13.3301C12.4532 12.7798 13.1982 11.9303 13.6194 10.9134C14.0406 9.89653 14.1145 8.76907 13.8296 7.70591L17.6933 6.67063Z"/><path class="piece" d="M1.03528 0C2.56128 0.40889 3.95276 1.21226 5.06987 2.32937C6.18697 3.44648 6.99035 4.83796 7.39924 6.36396L3.53553 7.39924C3.30837 6.55146 2.86205 5.77841 2.24144 5.1578C1.62082 4.53718 0.847777 4.09086 0 3.8637L1.03528 0Z" transform="translate(11.708 -1.108)"/></svg><span aria-hidden="true">duno</span></h1>
<div class="notice" role="status">
<div id="msg">
<p>인터넷에 연결되지 않았어요.</p>
<p>연결되면 할 일을 불러올게요.</p>
</div>
<button type="button" class="btn" id="retry">다시 연결해 보기</button>
</div>
</main>
<script>
(function () {
  var button = document.getElementById("retry");
  var busy = false;
  var LINES = ["인터넷에 연결되지 않았어요.", "연결되면 할 일을 불러올게요."];
  function reload() { location.reload(); }
  // 연결이 돌아오면 누르지 않아도 다시 불러온다
  window.addEventListener("online", reload);
  button.addEventListener("click", function () {
    if (busy) return;
    busy = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = "연결해 보는 중";
    // /sw.js는 서비스 워커가 가로채지 않는 주소라, 정말 연결될 때만 성공한다
    fetch("/sw.js", { cache: "no-store" })
      .then(function (res) { if (res.ok) reload(); else throw new Error("down"); })
      .catch(function () {
        busy = false;
        button.removeAttribute("aria-busy");
        button.textContent = "다시 연결해 보기";
        // 같은 안내를 다시 읽히게 한다(명세 2-6): 글을 비운 뒤 100ms 뒤에 다시 넣는다. textContent만 쓴다.
        var msg = document.getElementById("msg");
        msg.textContent = "";
        setTimeout(function () {
          LINES.forEach(function (line) {
            var p = document.createElement("p");
            p.textContent = line;
            msg.appendChild(p);
          });
        }, 100);
      });
  });
})();
</script>
</body>
</html>
