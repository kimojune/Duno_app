<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duno</title>
<style>
/* :root의 값은 lib/design-tokens.ts와 같아야 한다(정적 파일이라 그 모듈을 못 읽는다. tests/unit/design-tokens.test.ts가 같은지 본다).
   값을 바꿀 때는 그 표와 app/globals.css :root도 같이 바꾼다. :root 밖에서는 색 hex를 쓰지 않는다. */
:root{
  --color-bg:#FAF7F2;--color-text:#1C2340;--color-text-sub:#5E6478;
  --color-primary:#1C2340;--color-primary-pressed:#2E3350;--color-on-primary:#FFFFFF;--color-notice-bg:#F3EEE6;
  --font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  --font-title:700 24px/32px var(--font-family);
  --font-body:400 16px/24px var(--font-family);
  --tap-min:48px;--page-x:16px;--page-max:480px;--radius-pill:999px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:var(--font-body)}
main{max-width:var(--page-max);margin:0 auto;padding:24px var(--page-x)}
h1{margin:0;font:var(--font-title)}
.notice{margin-top:16px;padding:12px 16px;border-radius:8px;background:var(--color-notice-bg);overflow-wrap:anywhere}
.notice p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap-min);margin-top:8px;padding:0 16px;border:1px solid var(--color-primary);border-radius:var(--radius-pill);background:var(--color-primary);color:var(--color-on-primary);font:var(--font-body);cursor:pointer}
.btn:active{background:var(--color-primary-pressed);border-color:var(--color-primary-pressed)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>
<main>
<!-- 로그인 여부를 알 수 없으니 로그인·할 일 화면을 흉내 내지 않는다 -->
<h1>duno</h1>
<div class="notice" role="status">
<div id="msg">
<p>인터넷에 연결되지 않았어요.</p>
<p>연결되면 할 일을 불러올게요.</p>
</div>
<button type="button" class="btn" id="retry">다시 연결해 보기</button>
</div>
</main>
<script>
(function () {
  var button = document.getElementById("retry");
  var busy = false;
  var LINES = ["인터넷에 연결되지 않았어요.", "연결되면 할 일을 불러올게요."];
  function reload() { location.reload(); }
  // 연결이 돌아오면 누르지 않아도 다시 불러온다
  window.addEventListener("online", reload);
  button.addEventListener("click", function () {
    if (busy) return;
    busy = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = "연결해 보는 중";
    // /sw.js는 서비스 워커가 가로채지 않는 주소라, 정말 연결될 때만 성공한다
    fetch("/sw.js", { cache: "no-store" })
      .then(function (res) { if (res.ok) reload(); else throw new Error("down"); })
      .catch(function () {
        busy = false;
        button.removeAttribute("aria-busy");
        button.textContent = "다시 연결해 보기";
        // 같은 안내를 다시 읽히게 한다(명세 2-6): 글을 비운 뒤 100ms 뒤에 다시 넣는다. textContent만 쓴다.
        var msg = document.getElementById("msg");
        msg.textContent = "";
        setTimeout(function () {
          LINES.forEach(function (line) {
            var p = document.createElement("p");
            p.textContent = line;
            msg.appendChild(p);
          });
        }, 100);
      });
  });
})();
</script>
</body>
</html>
